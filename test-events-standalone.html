<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events Test - JKUAT Innovation Club</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Styles -->
    <link rel="stylesheet" href="pages/events/events.css">
    
    <style>
        /* Override for standalone test */
        body {
            padding-top: 20px !important;
        }
        
        /* Simple navbar for testing */
        .test-navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #1f2937;
            color: white;
            padding: 0.5rem 1rem;
            z-index: 1000;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- Simple test navbar -->
    <div class="test-navbar">
        JKUAT Innovation Club - Events Test
    </div>
    
    <!-- Main Events Page -->
    <main id="eventsPage" class="events-page">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="header-title">Events</h1>
                <div class="header-actions">
                    <button class="header-btn" title="Search">
                        <i class="fas fa-search"></i>
                    </button>
                    <button class="header-btn" title="Notifications">
                        <i class="fas fa-bell"></i>
                    </button>
                    <button class="header-btn" title="Menu">
                        <i class="fas fa-bars"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Stats Bar -->
        <section class="stats-bar">
            <div class="stat-item">
                <span class="stat-value" id="totalEventsCount">0</span>
                <div class="stat-label">Total Events</div>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="upcomingEventsCount">0</span>
                <div class="stat-label">Upcoming</div>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="totalAttendeesCount">0</span>
                <div class="stat-label">Attendees</div>
            </div>
        </section>

        <!-- Filter Tabs -->
        <nav class="filter-tabs">
            <button class="filter-tab active" data-filter="all">All</button>
            <button class="filter-tab" data-filter="upcoming">Upcoming</button>
            <button class="filter-tab" data-filter="live">Live</button>
            <button class="filter-tab" data-filter="completed">Completed</button>
            <button class="filter-tab" data-filter="workshop">Workshops</button>
            <button class="filter-tab" data-filter="seminar">Seminars</button>
            <button class="filter-tab" data-filter="competition">Competitions</button>
        </nav>

        <!-- Events Container -->
        <section class="events-container">
            <!-- Loading State -->
            <div class="loading-skeleton" id="eventsLoading">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Loading events...</p>
            </div>

            <!-- Events Grid -->
            <div id="eventsGrid">
                <!-- Events will be rendered here by JavaScript -->
            </div>

            <!-- No Events State -->
            <div class="no-events" id="noEventsMessage" style="display: none;">
                <div class="no-events-icon">🎪</div>
                <h3>No events found</h3>
                <p>Check back later for exciting events!</p>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="pages/events/events.js"></script>
</body>
</html>
