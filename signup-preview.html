<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - JKUAT Innovation Club</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="pages/complete-registration/signup-modern.css">
</head>
<body>
    <div class="signup-container">
        <!-- Left Side - Form -->
        <div class="form-side">
            <div class="form-content">
                <h1 class="signup-title">SIGN UP</h1>
                
                <form id="signupForm" class="signup-form">
                    <!-- Email -->
                    <div class="input-group">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" placeholder="e-mail" required>
                    </div>
                    
                    <!-- Password -->
                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" placeholder="password" required>
                    </div>
                    
                    <!-- Terms Checkbox -->
                    <div class="checkbox-group">
                        <input type="checkbox" id="agreeTerms" required>
                        <label for="agreeTerms">
                            I agree all statements in <a href="/terms" class="terms-link">terms of service</a>
                        </label>
                    </div>
                    
                    <!-- Submit Button -->
                    <button type="submit" class="signup-btn">SIGN UP</button>
                </form>
                
                <!-- Social Login -->
                <div class="social-login">
                    <button class="social-btn facebook" aria-label="Sign up with Facebook">
                        <i class="fab fa-facebook-f"></i>
                    </button>
                    <button class="social-btn google" aria-label="Sign up with Google">
                        <i class="fab fa-google"></i>
                    </button>
                    <button class="social-btn twitter" aria-label="Sign up with Twitter">
                        <i class="fab fa-twitter"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Right Side - Image -->
        <div class="image-side">
            <div class="image-overlay">
                <h2 class="image-title">JKUAT INNOVATION</h2>
                <p class="image-subtitle">& ENTREPRENEURSHIP CLUB</p>
            </div>
        </div>
    </div>

    <script src="pages/complete-registration/signup-modern.js"></script>
</body>
</html>
