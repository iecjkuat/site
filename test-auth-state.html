<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth State Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .status {
            padding: 20px;
            margin: 10px 0;
            border-radius: 8px;
            border: 2px solid #ddd;
        }
        .status.success { background: #d4edda; border-color: #28a745; }
        .status.error { background: #f8d7da; border-color: #dc3545; }
        .status.warning { background: #fff3cd; border-color: #ffc107; }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            font-size: 16px;
        }
        button:hover { background: #0056b3; }
        pre {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🔐 Auth State Test Page</h1>
    
    <div id="status" class="status warning">
        <strong>Status:</strong> Checking...
    </div>
    
    <div>
        <button onclick="checkAuth()">Check Auth State</button>
        <button onclick="checkStorage()">Check Storage</button>
        <button onclick="triggerLogin()">Trigger Login Event</button>
        <button onclick="clearAuth()">Clear Auth</button>
    </div>
    
    <h2>Results:</h2>
    <pre id="results">Click a button to see results...</pre>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.91.0/dist/umd/supabase.js"></script>
    <script src="/shared/auth.js"></script>
    <script src="/shared/global-navbar.js"></script>
    
    <script>
        const resultsEl = document.getElementById('results');
        const statusEl = document.getElementById('status');
        
        function updateStatus(message, type = 'warning') {
            statusEl.className = `status ${type}`;
            statusEl.innerHTML = `<strong>Status:</strong> ${message}`;
        }
        
        function log(message) {
            resultsEl.textContent += message + '\n';
        }
        
        function checkAuth() {
            resultsEl.textContent = '';
            log('=== AUTH STATE CHECK ===\n');
            
            // Check if auth manager exists
            if (window.authManager) {
                log('✅ window.authManager exists');
                log(`   isAuthenticated: ${window.authManager.isAuthenticated()}`);
                
                const user = window.authManager.getUser();
                if (user) {
                    log(`   User: ${JSON.stringify(user, null, 2)}`);
                    updateStatus('Authenticated as ' + user.email, 'success');
                } else {
                    log('   User: null');
                    updateStatus('Not authenticated', 'error');
                }
            } else {
                log('❌ window.authManager not found');
                updateStatus('Auth manager not initialized', 'error');
            }
            
            // Check navbar button
            const navBtn = document.getElementById('navbar-login-btn');
            if (navBtn) {
                log(`\n✅ Navbar button found`);
                log(`   Text: "${navBtn.textContent.trim()}"`);
            } else {
                log('\n❌ Navbar button not found');
            }
        }
        
        function checkStorage() {
            resultsEl.textContent = '';
            log('=== STORAGE CHECK ===\n');
            
            const token = localStorage.getItem('authToken') || sessionStorage.getItem('authToken');
            const user = localStorage.getItem('user');
            
            if (token) {
                log('✅ Token found in storage');
                log(`   Length: ${token.length} characters`);
                log(`   First 50 chars: ${token.substring(0, 50)}...`);
            } else {
                log('❌ No token in storage');
            }
            
            if (user) {
                log('\n✅ User data found in storage');
                try {
                    const userData = JSON.parse(user);
                    log(`   User: ${JSON.stringify(userData, null, 2)}`);
                } catch (e) {
                    log(`   Error parsing user data: ${e.message}`);
                }
            } else {
                log('\n❌ No user data in storage');
            }
        }
        
        function triggerLogin() {
            resultsEl.textContent = '';
            log('=== TRIGGERING LOGIN EVENT ===\n');
            
            const user = localStorage.getItem('user');
            if (user) {
                try {
                    const userData = JSON.parse(user);
                    log('Dispatching userLoggedIn event...');
                    document.dispatchEvent(new CustomEvent('userLoggedIn', { detail: userData }));
                    log('✅ Event dispatched');
                    
                    setTimeout(() => {
                        const navBtn = document.getElementById('navbar-login-btn');
                        if (navBtn) {
                            log(`\nNavbar button text: "${navBtn.textContent.trim()}"`);
                        }
                    }, 500);
                } catch (e) {
                    log(`❌ Error: ${e.message}`);
                }
            } else {
                log('❌ No user data in storage to trigger event');
            }
        }
        
        function clearAuth() {
            resultsEl.textContent = '';
            log('=== CLEARING AUTH ===\n');
            
            localStorage.removeItem('authToken');
            sessionStorage.removeItem('authToken');
            localStorage.removeItem('user');
            
            log('✅ Cleared all auth data from storage');
            log('\nReload the page to see changes');
            
            updateStatus('Auth cleared - reload page', 'warning');
        }
        
        // Auto-check on load
        window.addEventListener('load', () => {
            setTimeout(() => {
                checkAuth();
            }, 1000);
        });
        
        // Listen for auth events
        document.addEventListener('userLoggedIn', (e) => {
            console.log('🎯 userLoggedIn event received!', e.detail);
        });
        
        document.addEventListener('authReady', () => {
            console.log('🎯 authReady event received!');
        });
    </script>
</body>
</html>
