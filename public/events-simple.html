<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events - JKUAT Innovation Club</title>
    
    <!-- Stylesheets -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.0/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/css/main.css" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(135deg, #1e3a8a, #3730a3, #7c3aed);
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
        
        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }
        
        .event-card {
            padding: 2rem;
            margin-bottom: 2rem;
            position: relative;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }
        
        .btn-outline {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            padding: 2rem;
            overflow-y: auto;
        }
        
        .modal-content {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 2rem;
        }
        
        .close-btn {
            float: right;
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }
        
        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        
        @media (max-width: 768px) {
            .events-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav style="background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.2); padding: 1rem 0; position: sticky; top: 0; z-index: 100;">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h1 style="font-size: 1.5rem; font-weight: 700; margin: 0;">JKUAT Innovation Club</h1>
                <div style="display: flex; gap: 1rem;">
                    <a href="/" class="btn btn-outline">Home</a>
                    <a href="/events" class="btn btn-primary">Events</a>
                    <a href="/dashboard" class="btn btn-outline">Dashboard</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section style="padding: 4rem 0; text-align: center;">
        <div class="container">
            <h1 style="font-size: 3rem; font-weight: 800; margin-bottom: 1rem;">Innovation Events</h1>
            <p style="font-size: 1.25rem; color: rgba(255, 255, 255, 0.8); margin-bottom: 2rem;">
                Join our exciting lineup of workshops, hackathons, and networking events
            </p>
        </div>
    </section>

    <!-- Events Section -->
    <section style="padding: 2rem 0;">
        <div class="container">
            <div id="eventsContainer" class="events-grid">
                <!-- Events will be loaded here -->
            </div>
        </div>
    </section>

    <!-- Event Details Modal -->
    <div id="eventModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <div id="modalContent">
                <!-- Modal content will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Load Scripts -->
    <script src="/js/data/events-mock-data.js"></script>

    <script>
        let currentEvents = [];

        // Load and display events
        function loadEvents() {
            console.log('Loading events...');
            
            try {
                if (typeof EventsMockData === 'undefined') {
                    console.error('EventsMockData not available');
                    return;
                }

                currentEvents = EventsMockData.getEvents();
                console.log('Loaded', currentEvents.length, 'events');
                
                displayEvents(currentEvents);
            } catch (error) {
                console.error('Error loading events:', error);
                document.getElementById('eventsContainer').innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 3rem;">
                        <h3>Error Loading Events</h3>
                        <p>Please refresh the page to try again.</p>
                    </div>
                `;
            }
        }

        // Display events in the grid
        function displayEvents(events) {
            const container = document.getElementById('eventsContainer');
            
            if (events.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 3rem;">
                        <h3>No Events Found</h3>
                        <p>Check back later for new events.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = events.map(event => createEventCard(event)).join('');
            
            // Add event listeners to buttons
            addEventListeners();
        }

        // Create event card HTML
        function createEventCard(event) {
            const startDate = new Date(event.start_date);
            const categoryColors = {
                'workshop': '#3b82f6',
                'seminar': '#10b981',
                'competition': '#f59e0b',
                'social': '#f472b6',
                'meeting': '#6b7280',
                'other': '#8b5cf6'
            };
            
            const categoryColor = categoryColors[event.event_type] || '#6b7280';
            const isUpcoming = event.status === 'upcoming' && startDate > new Date();

            return `
                <div class="event-card glass-card">
                    <div style="position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: ${categoryColor};"></div>
                    
                    <!-- Event Header -->
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem;">
                        <span style="background: ${categoryColor}20; color: ${categoryColor}; padding: 0.5rem 1rem; border-radius: 20px; font-size: 0.875rem; font-weight: 600; text-transform: capitalize;">
                            ${event.event_type}
                        </span>
                        <span style="color: rgba(255, 255, 255, 0.8); font-size: 0.875rem;">
                            ${startDate.toLocaleDateString()}
                        </span>
                    </div>
                    
                    <!-- Event Title -->
                    <h3 style="font-size: 1.5rem; font-weight: 700; color: white; margin-bottom: 1rem; line-height: 1.3;">
                        ${event.title}
                    </h3>
                    
                    <!-- Event Description -->
                    <p style="color: rgba(255, 255, 255, 0.8); line-height: 1.6; margin-bottom: 1.5rem;">
                        ${event.description.length > 150 ? event.description.substring(0, 150) + '...' : event.description}
                    </p>
                    
                    <!-- Event Details -->
                    <div style="margin-bottom: 1.5rem;">
                        <div style="display: flex; align-items: center; margin-bottom: 0.5rem; color: rgba(255, 255, 255, 0.8);">
                            <i class="fas fa-clock" style="margin-right: 0.75rem; color: #10b981; width: 16px;"></i>
                            <span>${startDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                        </div>
                        <div style="display: flex; align-items: center; margin-bottom: 0.5rem; color: rgba(255, 255, 255, 0.8);">
                            <i class="fas fa-map-marker-alt" style="margin-right: 0.75rem; color: #3b82f6; width: 16px;"></i>
                            <span>${event.location}</span>
                        </div>
                        <div style="display: flex; align-items: center; margin-bottom: 0.5rem; color: rgba(255, 255, 255, 0.8);">
                            <i class="fas fa-users" style="margin-right: 0.75rem; color: #f59e0b; width: 16px;"></i>
                            <span>${event.stats?.totalAttendees || 0} attendees</span>
                        </div>
                        <div style="display: flex; align-items: center; color: rgba(255, 255, 255, 0.8);">
                            <i class="fas fa-tag" style="margin-right: 0.75rem; color: #f472b6; width: 16px;"></i>
                            <span>${event.fee > 0 ? 'KES ' + event.fee.toLocaleString() : 'Free for members'}</span>
                        </div>
                    </div>
                    
                    <!-- Action Buttons -->
                    <div style="display: flex; gap: 1rem;">
                        <button class="btn btn-outline details-btn" data-event-id="${event.id}">
                            <i class="fas fa-info-circle"></i>Details
                        </button>
                        <button class="btn ${isUpcoming ? 'btn-primary' : 'btn-outline'} register-btn" 
                                data-event-id="${event.id}" 
                                data-event-title="${event.title}"
                                ${!isUpcoming ? 'disabled' : ''}>
                            <i class="fas fa-${isUpcoming ? 'calendar-plus' : 'calendar-times'}"></i>
                            ${isUpcoming ? 'Register Now' : 'Registration Closed'}
                        </button>
                    </div>
                </div>
            `;
        }

        // Add event listeners to buttons
        function addEventListeners() {
            // Details buttons
            document.querySelectorAll('.details-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const eventId = e.target.closest('.details-btn').dataset.eventId;
                    showEventDetails(eventId);
                });
            });

            // Register buttons
            document.querySelectorAll('.register-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const button = e.target.closest('.register-btn');
                    const eventId = button.dataset.eventId;
                    const eventTitle = button.dataset.eventTitle;
                    registerForEvent(eventId, eventTitle);
                });
            });
        }

        // Show event details in modal
        function showEventDetails(eventId) {
            const event = currentEvents.find(e => e.id === eventId);
            if (!event) return;

            const startDate = new Date(event.start_date);
            const endDate = new Date(event.end_date);

            document.getElementById('modalContent').innerHTML = `
                <h2 style="color: white; font-size: 2rem; font-weight: 700; margin-bottom: 1rem;">${event.title}</h2>
                
                <div style="background: rgba(255, 255, 255, 0.05); padding: 1.5rem; border-radius: 12px; margin-bottom: 2rem;">
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem;">
                        <div>
                            <h4 style="color: white; font-weight: 600; margin-bottom: 0.5rem;">📅 Date & Time</h4>
                            <p style="color: rgba(255, 255, 255, 0.8);">${startDate.toLocaleDateString()}</p>
                            <p style="color: rgba(255, 255, 255, 0.8);">${startDate.toLocaleTimeString()} - ${endDate.toLocaleTimeString()}</p>
                        </div>
                        <div>
                            <h4 style="color: white; font-weight: 600; margin-bottom: 0.5rem;">📍 Location</h4>
                            <p style="color: rgba(255, 255, 255, 0.8);">${event.location}</p>
                            ${event.venue_details ? `<p style="color: rgba(255, 255, 255, 0.6);">${event.venue_details}</p>` : ''}
                        </div>
                        <div>
                            <h4 style="color: white; font-weight: 600; margin-bottom: 0.5rem;">👥 Attendance</h4>
                            <p style="color: rgba(255, 255, 255, 0.8);">${event.stats?.totalAttendees || 0} attendees</p>
                            ${event.max_attendees ? `<p style="color: rgba(255, 255, 255, 0.6);">Max: ${event.max_attendees}</p>` : ''}
                        </div>
                        <div>
                            <h4 style="color: white; font-weight: 600; margin-bottom: 0.5rem;">💰 Fee</h4>
                            <p style="color: rgba(255, 255, 255, 0.8);">${event.fee > 0 ? 'KES ' + event.fee.toLocaleString() : 'Free for members'}</p>
                        </div>
                    </div>
                </div>
                
                <div style="margin-bottom: 2rem;">
                    <h4 style="color: white; font-weight: 600; margin-bottom: 1rem;">📝 Description</h4>
                    <p style="color: rgba(255, 255, 255, 0.8); line-height: 1.6;">${event.description}</p>
                </div>
                
                ${event.tags && event.tags.length > 0 ? `
                    <div style="margin-bottom: 2rem;">
                        <h4 style="color: white; font-weight: 600; margin-bottom: 1rem;">🏷️ Tags</h4>
                        <div style="display: flex; flex-wrap: wrap; gap: 0.5rem;">
                            ${event.tags.map(tag => `
                                <span style="background: rgba(255, 255, 255, 0.1); color: rgba(255, 255, 255, 0.8); padding: 0.5rem 1rem; border-radius: 20px; font-size: 0.875rem;">
                                    ${tag}
                                </span>
                            `).join('')}
                        </div>
                    </div>
                ` : ''}
                
                <div style="text-align: center; margin-top: 2rem;">
                    <button class="btn btn-primary" onclick="registerForEvent('${event.id}', '${event.title}')">
                        <i class="fas fa-calendar-plus"></i>Register for Event
                    </button>
                    <button class="btn btn-outline" onclick="closeModal()" style="margin-left: 1rem;">
                        <i class="fas fa-times"></i>Close
                    </button>
                </div>
            `;

            document.getElementById('eventModal').style.display = 'block';
        }

        // Register for event
        function registerForEvent(eventId, eventTitle) {
            alert(`Registration for "${eventTitle}" would be processed here.\n\nIn a real implementation, this would:\n- Check user authentication\n- Process payment if required\n- Send confirmation email\n- Update attendee count`);
            closeModal();
        }

        // Close modal
        function closeModal() {
            document.getElementById('eventModal').style.display = 'none';
        }

        // Close modal when clicking outside
        document.getElementById('eventModal').addEventListener('click', (e) => {
            if (e.target.id === 'eventModal') {
                closeModal();
            }
        });

        // Load events when page loads
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Page loaded, loading events...');
            loadEvents();
        });
    </script>
</body>
</html>
