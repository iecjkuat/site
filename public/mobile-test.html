<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Test - JKUAT Innovation Club</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 2rem;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            min-height: 100vh;
        }
        
        .test-container {
            max-width: 400px;
            margin: 0 auto;
            text-align: center;
        }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: #10b981;
        }
        
        .test-item {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        
        .btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin: 0.5rem 0;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3);
        }
        
        .status {
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
        }
        
        .success {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            color: #10b981;
        }
        
        .info {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid #3b82f6;
            color: #3b82f6;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>📱 Mobile Test</h1>
        
        <div class="test-item">
            <h3>Screen Info</h3>
            <div class="status info">
                <div>Screen: <span id="screenSize"></span></div>
                <div>Viewport: <span id="viewportSize"></span></div>
                <div>Device Pixel Ratio: <span id="pixelRatio"></span></div>
                <div>User Agent: <span id="userAgent"></span></div>
            </div>
        </div>
        
        <div class="test-item">
            <h3>Touch Test</h3>
            <button class="btn" onclick="testTouch()">Test Touch Response</button>
            <div id="touchResult" class="status" style="display: none;"></div>
        </div>
        
        <div class="test-item">
            <h3>Background Test</h3>
            <div class="status success">
                ✅ New gradient background loaded successfully!<br>
                No external image dependencies.
            </div>
        </div>
        
        <div class="test-item">
            <h3>Navigation</h3>
            <button class="btn" onclick="window.location.href='/'">← Back to Home</button>
            <button class="btn" onclick="window.location.href='/dashboard'">Go to Dashboard →</button>
        </div>
        
        <div class="test-item">
            <h3>Performance</h3>
            <div id="performanceInfo" class="status info"></div>
        </div>
    </div>

    <script>
        // Display screen info
        document.getElementById('screenSize').textContent = `${screen.width}x${screen.height}`;
        document.getElementById('viewportSize').textContent = `${window.innerWidth}x${window.innerHeight}`;
        document.getElementById('pixelRatio').textContent = window.devicePixelRatio;
        document.getElementById('userAgent').textContent = navigator.userAgent.substring(0, 50) + '...';
        
        // Touch test
        function testTouch() {
            const result = document.getElementById('touchResult');
            result.style.display = 'block';
            result.className = 'status success';
            result.innerHTML = '✅ Touch response working! Button pressed successfully.';
            
            // Haptic feedback if available
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
            
            setTimeout(() => {
                result.style.display = 'none';
            }, 3000);
        }
        
        // Performance info
        window.addEventListener('load', () => {
            const perfInfo = document.getElementById('performanceInfo');
            const loadTime = performance.now();
            
            perfInfo.innerHTML = `
                <div>Page Load Time: ${Math.round(loadTime)}ms</div>
                <div>Connection: ${navigator.connection ? navigator.connection.effectiveType : 'Unknown'}</div>
                <div>Memory: ${navigator.deviceMemory ? navigator.deviceMemory + 'GB' : 'Unknown'}</div>
            `;
        });
        
        // Orientation change handler
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                document.getElementById('viewportSize').textContent = `${window.innerWidth}x${window.innerHeight}`;
            }, 100);
        });
    </script>
</body>
</html>
