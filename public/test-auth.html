<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Test - JKUAT Innovation Club</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 2rem;
            background: #1a1a1a;
            color: white;
        }
        .test-section {
            margin: 2rem 0;
            padding: 1rem;
            border: 1px solid #333;
            border-radius: 8px;
        }
        button {
            padding: 0.5rem 1rem;
            margin: 0.5rem;
            border: none;
            border-radius: 4px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        #log {
            background: #000;
            padding: 1rem;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.875rem;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>Authentication System Test</h1>
    
    <div class="test-section">
        <h2>Button Tests</h2>
        <button id="loginBtn">Login Button</button>
        <button id="registerBtn">Register Button</button>
        <button id="heroRegisterBtn">Hero Register Button</button>
        <button id="joinMembershipBtn">Join Membership Button</button>
        <button id="viewEventsBtn">View Events Button</button>
        <button id="heroLearnMoreBtn">Learn More Button</button>
    </div>
    
    <div class="test-section">
        <h2>Auth Manager Status</h2>
        <button onclick="checkAuthManager()">Check Auth Manager</button>
        <button onclick="testModals()">Test Modals</button>
        <button onclick="clearLog()">Clear Log</button>
    </div>
    
    <div class="test-section">
        <h2>Console Log</h2>
        <div id="log"></div>
    </div>

    <!-- Include the auth component -->
    <script src="/js/components/auth.js"></script>
    
    <script>
        // Override console.log to show in our log div
        const originalLog = console.log;
        const logDiv = document.getElementById('log');
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            const message = args.map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
            ).join(' ');
            logDiv.innerHTML += `<div>${new Date().toLocaleTimeString()}: ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        };
        
        function checkAuthManager() {
            console.log('=== Auth Manager Check ===');
            console.log('authManager exists:', typeof authManager !== 'undefined');
            if (typeof authManager !== 'undefined') {
                console.log('authManager.currentUser:', authManager.currentUser);
                console.log('authManager.loginModal exists:', !!authManager.loginModal);
                console.log('authManager.registerModal exists:', !!authManager.registerModal);
            }
        }
        
        function testModals() {
            console.log('=== Modal Test ===');
            if (typeof authManager !== 'undefined') {
                console.log('Testing login modal...');
                authManager.showLogin();
                setTimeout(() => {
                    authManager.hideLogin();
                    console.log('Testing register modal...');
                    authManager.showRegister();
                    setTimeout(() => {
                        authManager.hideRegister();
                        console.log('Modal test complete');
                    }, 2000);
                }, 2000);
            } else {
                console.log('AuthManager not available');
            }
        }
        
        function clearLog() {
            logDiv.innerHTML = '';
        }
        
        // Test button clicks
        document.addEventListener('click', (e) => {
            if (e.target.tagName === 'BUTTON' && e.target.id) {
                console.log('Button clicked:', e.target.id);
            }
        });
        
        // Log when page loads
        document.addEventListener('DOMContentLoaded', () => {
            console.log('=== Page Loaded ===');
            console.log('DOM Content Loaded');
            setTimeout(() => {
                checkAuthManager();
            }, 1000);
        });
    </script>
</body>
</html>
