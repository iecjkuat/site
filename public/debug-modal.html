<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Debug Test</title>
    <link href="/css/main.css" rel="stylesheet">
    <style>
        body {
            background: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            padding: 2rem;
        }
        
        .test-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        
        .test-modal-content {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 2rem;
            border-radius: 20px;
            max-width: 400px;
            width: 100%;
            color: white;
        }
        
        button {
            padding: 0.75rem 1.5rem;
            margin: 0.5rem;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        
        button:hover {
            background: #0056b3;
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <h1>Modal Debug Test</h1>
    
    <div>
        <button onclick="showTestModal()">Show Test Modal</button>
        <button onclick="testAuthModal()">Test Auth Modal</button>
        <button onclick="checkAuthManager()">Check Auth Manager</button>
    </div>
    
    <div id="testModal" class="test-modal hidden">
        <div class="test-modal-content">
            <h2>Test Modal</h2>
            <p>This is a test modal to verify CSS and JavaScript functionality.</p>
            <button onclick="hideTestModal()">Close</button>
        </div>
    </div>
    
    <div id="log" style="background: #000; padding: 1rem; margin-top: 2rem; border-radius: 4px; font-family: monospace; font-size: 0.875rem; max-height: 300px; overflow-y: auto;"></div>

    <script>
        function log(message) {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += `<div>${new Date().toLocaleTimeString()}: ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }
        
        function showTestModal() {
            document.getElementById('testModal').classList.remove('hidden');
            log('Test modal shown');
        }
        
        function hideTestModal() {
            document.getElementById('testModal').classList.add('hidden');
            log('Test modal hidden');
        }
        
        function testAuthModal() {
            if (window.authManager) {
                log('Testing auth modal...');
                window.authManager.showLogin();
            } else {
                log('Auth manager not found');
            }
        }
        
        function checkAuthManager() {
            log('=== Auth Manager Check ===');
            log(`AuthManager class exists: ${typeof AuthManager !== 'undefined'}`);
            log(`authManager instance exists: ${typeof window.authManager !== 'undefined'}`);
            
            if (window.authManager) {
                log(`currentUser: ${window.authManager.currentUser}`);
                log(`loginModal exists: ${!!window.authManager.loginModal}`);
                log(`registerModal exists: ${!!window.authManager.registerModal}`);
            }
            
            // Check buttons
            const buttons = ['loginBtn', 'registerBtn', 'heroRegisterBtn', 'joinMembershipBtn'];
            buttons.forEach(id => {
                const element = document.getElementById(id);
                log(`${id}: ${element ? 'EXISTS' : 'NOT FOUND'}`);
            });
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            log('DOM loaded');
            setTimeout(() => {
                checkAuthManager();
            }, 1000);
        });
    </script>
    
    <!-- Load auth component -->
    <script src="/js/components/auth.js"></script>
    
    <script>
        // Initialize auth manager manually for testing
        setTimeout(() => {
            if (typeof AuthManager !== 'undefined' && !window.authManager) {
                window.authManager = new AuthManager();
                log('Auth manager initialized manually');
            }
        }, 500);
    </script>
</body>
</html>
