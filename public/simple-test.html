<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Auth Test</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 2rem; 
            background: #1a1a1a; 
            color: white; 
        }
        button { 
            padding: 1rem 2rem; 
            margin: 1rem; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 1rem;
        }
        button:hover { background: #0056b3; }
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.8); 
            z-index: 1000;
        }
        .modal-content { 
            background: white; 
            color: black; 
            padding: 2rem; 
            margin: 10% auto; 
            width: 300px; 
            border-radius: 8px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <h1>Simple Authentication Test</h1>
    
    <div>
        <button id="loginBtn">Login</button>
        <button id="registerBtn">Register</button>
        <button id="heroRegisterBtn">Hero Register</button>
        <button id="joinMembershipBtn">Join Membership</button>
    </div>
    
    <div id="testModal" class="modal hidden">
        <div class="modal-content">
            <h2>Test Modal</h2>
            <p>This is a test modal to verify functionality.</p>
            <button onclick="hideTestModal()">Close</button>
        </div>
    </div>
    
    <div id="log" style="background: #000; padding: 1rem; margin-top: 2rem; border-radius: 4px; font-family: monospace; font-size: 0.875rem;"></div>

    <script>
        // Simple logging
        function log(message) {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += `<div>${new Date().toLocaleTimeString()}: ${message}</div>`;
            console.log(message);
        }
        
        function showTestModal() {
            document.getElementById('testModal').classList.remove('hidden');
            log('Test modal shown');
        }
        
        function hideTestModal() {
            document.getElementById('testModal').classList.add('hidden');
            log('Test modal hidden');
        }
        
        // Test basic click handling
        document.addEventListener('click', (e) => {
            if (e.target.tagName === 'BUTTON' && e.target.id) {
                log(`Button clicked: ${e.target.id}`);
                
                if (['loginBtn', 'registerBtn', 'heroRegisterBtn', 'joinMembershipBtn'].includes(e.target.id)) {
                    showTestModal();
                }
            }
        });
        
        // Test if auth manager loads
        document.addEventListener('DOMContentLoaded', () => {
            log('DOM loaded');
            
            setTimeout(() => {
                log(`AuthManager exists: ${typeof authManager !== 'undefined'}`);
                if (typeof authManager !== 'undefined') {
                    log(`AuthManager currentUser: ${authManager.currentUser}`);
                    log(`AuthManager loginModal exists: ${!!authManager.loginModal}`);
                }
            }, 1000);
        });
    </script>
    
    <!-- Load auth component -->
    <script src="/js/components/auth.js"></script>
</body>
</html>
