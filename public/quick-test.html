<!DOCTYPE html>
<html>
<head>
    <title>Quick Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1e3a8a; color: white; }
        .result { background: rgba(255,255,255,0.1); padding: 10px; margin: 10px 0; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Quick Events Test</h1>
    <div id="results"></div>

    <script src="/js/data/events-mock-data.js"></script>
    <script src="/js/services/events-service.js"></script>
    <script src="/js/components/event-cards.js"></script>

    <script>
        const results = document.getElementById('results');
        
        function addResult(title, content, isError = false) {
            const div = document.createElement('div');
            div.className = 'result';
            div.style.borderLeft = isError ? '4px solid #ef4444' : '4px solid #10b981';
            div.innerHTML = `<h3>${title}</h3><pre>${content}</pre>`;
            results.appendChild(div);
        }

        // Test 1: Check if EventsMockData is loaded
        try {
            if (typeof EventsMockData !== 'undefined') {
                const events = EventsMockData.getEvents();
                addResult('✅ EventsMockData Test', `Loaded ${events.length} events\nFirst event: ${events[0]?.title}`);
            } else {
                addResult('❌ EventsMockData Test', 'EventsMockData is not defined');
            }
        } catch (error) {
            addResult('❌ EventsMockData Test', error.message, true);
        }

        // Test 2: Check EventsService
        try {
            const service = new EventsService();
            addResult('✅ EventsService Test', `Created successfully\nMock mode: ${service.isMockDataMode()}`);
            
            // Test getting events
            service.getEvents().then(result => {
                addResult('✅ EventsService.getEvents()', `Returned ${result.events.length} events\nPagination: ${JSON.stringify(result.pagination, null, 2)}`);
                
                // Test EventCards
                if (typeof EventCards !== 'undefined') {
                    const cards = new EventCards(service);
                    const firstEventHTML = cards.createEventCard(result.events[0]);
                    addResult('✅ EventCards Test', `Generated HTML (${firstEventHTML.length} chars)\nFirst 200 chars: ${firstEventHTML.substring(0, 200)}...`);
                } else {
                    addResult('❌ EventCards Test', 'EventCards not defined');
                }
            }).catch(error => {
                addResult('❌ EventsService.getEvents()', error.message, true);
            });
            
        } catch (error) {
            addResult('❌ EventsService Test', error.message, true);
        }

        // Test 3: Check DOM elements that events page needs
        setTimeout(() => {
            const requiredElements = ['eventsGrid', 'eventsSection', 'categoryFilters'];
            requiredElements.forEach(id => {
                const element = document.getElementById(id);
                if (element) {
                    addResult(`✅ DOM Element: ${id}`, 'Found');
                } else {
                    addResult(`❌ DOM Element: ${id}`, 'Not found - this might be why events page is empty', true);
                }
            });
        }, 1000);
    </script>
</body>
</html>
