<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - JKUAT Innovation Club</title>
    
    <!-- Stylesheets -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.0/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/css/main.css" rel="stylesheet">
</head>
<body class="bg-pattern">
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
        <div class="glass-card" style="max-width: 500px; width: 100%; padding: 3rem;">
            
            <!-- Header -->
            <div style="text-align: center; margin-bottom: 2rem;">
                <div style="width: 60px; height: 60px; background: rgba(59, 130, 246, 0.2); backdrop-filter: blur(10px); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);">
                    <i class="fas fa-key" style="font-size: 1.5rem; color: #3b82f6;"></i>
                </div>
                <h1 style="font-size: 2rem; font-weight: 700; color: white; margin-bottom: 0.5rem;">Reset Your Password</h1>
                <p style="color: rgba(255, 255, 255, 0.8); font-size: 0.875rem;">Enter your new password below</p>
            </div>

            <!-- Reset Form -->
            <form id="resetPasswordForm" style="display: flex; flex-direction: column; gap: 1.5rem;">
                <div>
                    <label style="display: block; color: rgba(255, 255, 255, 0.9); font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem;">
                        <i class="fas fa-lock" style="margin-right: 0.5rem; color: #3b82f6;"></i>New Password
                    </label>
                    <input type="password" name="newPassword" placeholder="Enter your new password" required minlength="6" class="glass-input">
                    <p style="color: rgba(255, 255, 255, 0.6); font-size: 0.75rem; margin-top: 0.25rem;">
                        Password must be at least 6 characters long
                    </p>
                </div>
                
                <div>
                    <label style="display: block; color: rgba(255, 255, 255, 0.9); font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem;">
                        <i class="fas fa-lock" style="margin-right: 0.5rem; color: #3b82f6;"></i>Confirm Password
                    </label>
                    <input type="password" name="confirmPassword" placeholder="Confirm your new password" required minlength="6" class="glass-input">
                </div>

                <button type="submit" id="resetSubmitBtn" class="glass-button primary" style="width: 100%; justify-content: center;">
                    <i class="fas fa-check"></i>Reset Password
                </button>
            </form>

            <!-- Status Message -->
            <div id="statusMessage" class="hidden" style="margin-top: 1.5rem; padding: 1rem; border-radius: 8px; text-align: center;">
            </div>

            <!-- Back to Login -->
            <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid rgba(255, 255, 255, 0.1);">
                <p style="color: rgba(255, 255, 255, 0.8); font-size: 0.875rem;">
                    <a href="/" style="color: #3b82f6; text-decoration: none; font-weight: 600;">Back to Home</a>
                </p>
            </div>
            
        </div>
    </div>

    <script>
        class PasswordReset {
            constructor() {
                this.token = null;
                this.email = null;
                this.init();
            }

            init() {
                // Get token and email from URL parameters
                const urlParams = new URLSearchParams(window.location.search);
                this.token = urlParams.get('token');
                this.email = urlParams.get('email');
                
                if (!this.token || !this.email) {
                    this.showError('Invalid reset link. Please request a new password reset.');
                    return;
                }

                // Bind events
                this.bindEvents();
            }

            bindEvents() {
                document.getElementById('resetPasswordForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.handlePasswordReset(e);
                });
            }

            async handlePasswordReset(event) {
                const form = event.target;
                const formData = new FormData(form);
                const submitBtn = document.getElementById('resetSubmitBtn');
                
                const newPassword = formData.get('newPassword');
                const confirmPassword = formData.get('confirmPassword');

                // Validate passwords match
                if (newPassword !== confirmPassword) {
                    this.showError('Passwords do not match. Please try again.');
                    return;
                }

                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<div class="spinner"></div>Resetting Password...';
                submitBtn.disabled = true;
                
                try {
                    const response = await fetch('/api/auth/reset-password', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            token: this.token,
                            email: this.email,
                            newPassword: newPassword
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        this.showSuccess(data.message);
                        
                        // Redirect to login after 3 seconds
                        setTimeout(() => {
                            window.location.href = '/#login';
                        }, 3000);
                    } else {
                        this.showError(data.message || 'Password reset failed');
                    }
                } catch (error) {
                    console.error('Password reset error:', error);
                    this.showError('Network error. Please check your connection and try again.');
                } finally {
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                }
            }

            showSuccess(message) {
                const statusMessage = document.getElementById('statusMessage');
                statusMessage.className = '';
                statusMessage.style.background = 'rgba(16, 185, 129, 0.1)';
                statusMessage.style.border = '1px solid rgba(16, 185, 129, 0.2)';
                statusMessage.style.color = '#10b981';
                statusMessage.innerHTML = `
                    <i class="fas fa-check-circle" style="margin-right: 0.5rem;"></i>
                    ${message} Redirecting to login...
                `;
            }

            showError(message) {
                const statusMessage = document.getElementById('statusMessage');
                statusMessage.className = '';
                statusMessage.style.background = 'rgba(239, 68, 68, 0.1)';
                statusMessage.style.border = '1px solid rgba(239, 68, 68, 0.2)';
                statusMessage.style.color = '#ef4444';
                statusMessage.innerHTML = `
                    <i class="fas fa-exclamation-circle" style="margin-right: 0.5rem;"></i>
                    ${message}
                `;
            }
        }

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new PasswordReset();
        });
    </script>
</body>
</html>
