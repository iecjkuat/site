<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- TechCorp Kenya Logo -->
  <circle cx="50" cy="50" r="35" fill="#1565C0"/>
  <!-- Circuit board pattern -->
  <circle cx="35" cy="35" r="3" fill="#64B5F6"/>
  <circle cx="50" cy="30" r="3" fill="#64B5F6"/>
  <circle cx="65" cy="35" r="3" fill="#64B5F6"/>
  <circle cx="35" cy="65" r="3" fill="#64B5F6"/>
  <circle cx="65" cy="65" r="3" fill="#64B5F6"/>
  <!-- Connecting lines -->
  <line x1="38" y1="35" x2="47" y2="30" stroke="#64B5F6" stroke-width="2"/>
  <line x1="53" y1="30" x2="62" y2="35" stroke="#64B5F6" stroke-width="2"/>
  <line x1="35" y1="38" x2="35" y2="62" stroke="#64B5F6" stroke-width="2"/>
  <line x1="65" y1="38" x2="65" y2="62" stroke="#64B5F6" stroke-width="2"/>
  <!-- Center chip -->
  <rect x="45" y="45" width="10" height="10" fill="#FFF" rx="1"/>
  <text x="50" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#1565C0">TC</text>
  <!-- Company name -->
  <text x="50" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="white">TECHCORP</text>
</svg>