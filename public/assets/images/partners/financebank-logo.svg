<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- FinanceBank Logo -->
  <circle cx="50" cy="50" r="35" fill="#673AB7"/>
  <!-- Bank building -->
  <rect x="35" y="40" width="30" height="25" fill="white"/>
  <!-- Columns -->
  <rect x="38" y="35" width="3" height="30" fill="white"/>
  <rect x="44" y="35" width="3" height="30" fill="white"/>
  <rect x="50" y="35" width="3" height="30" fill="white"/>
  <rect x="56" y="35" width="3" height="30" fill="white"/>
  <!-- Roof -->
  <polygon points="32,40 50,30 68,40" fill="white"/>
  <!-- Door -->
  <rect x="47" y="55" width="6" height="10" fill="#673AB7"/>
  <!-- Dollar sign -->
  <circle cx="50" cy="25" r="6" fill="#4CAF50"/>
  <text x="50" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">$</text>
  <!-- Text -->
  <text x="50" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="white">FINANCEBANK</text>
</svg>