<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Innovation Hub Logo -->
  <circle cx="50" cy="50" r="35" fill="#FF6F00"/>
  <!-- Lightbulb -->
  <circle cx="45" cy="40" r="12" fill="#FFF9C4" stroke="#FFC107" stroke-width="2"/>
  <!-- Filament -->
  <path d="M 40 35 Q 45 30 50 35 Q 45 40 40 35" fill="none" stroke="#FF8F00" stroke-width="1.5"/>
  <!-- Base -->
  <rect x="41" y="50" width="8" height="6" rx="1" fill="#FFC107"/>
  <!-- Rocket -->
  <polygon points="60,30 65,20 70,30 70,45 60,45" fill="#E53935"/>
  <polygon points="60,45 65,50 70,45" fill="#FF5722"/>
  <!-- Rocket window -->
  <circle cx="65" cy="32" r="2" fill="#FFEB3B"/>
  <!-- Spark lines -->
  <line x1="25" y1="25" x2="30" y2="20" stroke="#FFEB3B" stroke-width="2"/>
  <line x1="20" y1="35" x2="25" y2="30" stroke="#FFEB3B" stroke-width="2"/>
  <line x1="75" y1="25" x2="80" y2="20" stroke="#FFEB3B" stroke-width="2"/>
  <!-- Text -->
  <text x="50" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="white">INNOVATION HUB</text>
</svg>