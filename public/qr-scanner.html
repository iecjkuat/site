<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Scanner - JKUAT Innovation Club</title>
    
    <!-- Stylesheets -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/css/main.css" rel="stylesheet">
    
    <!-- QR Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <style>
        body {
            background: linear-gradient(135deg, #1e3a8a, #3730a3, #7c3aed);
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            margin-bottom: 2rem;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        #qr-reader {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        
        .scan-result {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 8px;
            padding: 1rem;
            margin: 1rem 0;
        }
        
        .scan-error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            padding: 1rem;
            margin: 1rem 0;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        .recent-scans {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .scan-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="glass-card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1 style="margin: 0; font-size: 2rem; font-weight: 700;">
                        <i class="fas fa-qrcode"></i> QR Code Scanner
                    </h1>
                    <p style="margin: 0.5rem 0 0 0; color: rgba(255, 255, 255, 0.8);">
                        Scan attendee QR codes for event check-in
                    </p>
                </div>
                <a href="/events" class="btn btn-primary">
                    <i class="fas fa-arrow-left"></i> Back to Events
                </a>
            </div>
        </div>

        <!-- Event Selection -->
        <div class="glass-card">
            <h3 style="margin-bottom: 1rem;">
                <i class="fas fa-calendar"></i> Select Event
            </h3>
            <select id="eventSelect" style="width: 100%; padding: 0.75rem; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; color: white; margin-bottom: 1rem;">
                <option value="">Select an event...</option>
            </select>
            
            <div id="eventInfo" style="display: none;">
                <h4 id="selectedEventTitle" style="color: white; margin-bottom: 0.5rem;"></h4>
                <p id="selectedEventDetails" style="color: rgba(255, 255, 255, 0.8); margin-bottom: 1rem;"></p>
            </div>
        </div>

        <!-- Scanner Section -->
        <div class="glass-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h3 style="margin: 0;">
                    <i class="fas fa-camera"></i> QR Code Scanner
                </h3>
                <div>
                    <button id="startScanBtn" class="btn btn-primary" onclick="startScanning()">
                        <i class="fas fa-play"></i> Start Scanner
                    </button>
                    <button id="stopScanBtn" class="btn btn-danger" onclick="stopScanning()" style="display: none;">
                        <i class="fas fa-stop"></i> Stop Scanner
                    </button>
                </div>
            </div>
            
            <div id="qr-reader" style="display: none;"></div>
            <div id="scanResults"></div>
        </div>

        <!-- Statistics -->
        <div class="glass-card">
            <h3 style="margin-bottom: 1rem;">
                <i class="fas fa-chart-bar"></i> Attendance Statistics
            </h3>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" style="color: #10b981;" id="totalRegistered">0</div>
                    <div style="color: rgba(255, 255, 255, 0.8);">Total Registered</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" style="color: #3b82f6;" id="totalCheckedIn">0</div>
                    <div style="color: rgba(255, 255, 255, 0.8);">Checked In</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" style="color: #f59e0b;" id="attendanceRate">0%</div>
                    <div style="color: rgba(255, 255, 255, 0.8);">Attendance Rate</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" style="color: #f472b6;" id="noShows">0</div>
                    <div style="color: rgba(255, 255, 255, 0.8);">No Shows</div>
                </div>
            </div>
        </div>

        <!-- Recent Scans -->
        <div class="glass-card">
            <h3 style="margin-bottom: 1rem;">
                <i class="fas fa-history"></i> Recent Check-ins
            </h3>
            <div id="recentScans" class="recent-scans">
                <p style="color: rgba(255, 255, 255, 0.6); text-align: center; padding: 2rem;">
                    No check-ins yet. Start scanning QR codes to see recent activity.
                </p>
            </div>
        </div>
    </div>

    <!-- Load Scripts -->
    <script src="/js/data/events-mock-data.js"></script>

    <script>
        let html5QrCode;
        let selectedEventId = null;
        let scanCount = 0;
        let checkedInUsers = new Set();

        // Initialize page
        document.addEventListener('DOMContentLoaded', () => {
            loadEvents();
        });

        // Load events for selection
        function loadEvents() {
            try {
                const events = EventsMockData.getEvents();
                const eventSelect = document.getElementById('eventSelect');
                
                events.forEach(event => {
                    const option = document.createElement('option');
                    option.value = event.id;
                    option.textContent = `${event.title} - ${new Date(event.start_date).toLocaleDateString()}`;
                    eventSelect.appendChild(option);
                });

                eventSelect.addEventListener('change', (e) => {
                    selectEvent(e.target.value);
                });
            } catch (error) {
                console.error('Error loading events:', error);
            }
        }

        // Select event
        function selectEvent(eventId) {
            if (!eventId) {
                document.getElementById('eventInfo').style.display = 'none';
                selectedEventId = null;
                return;
            }

            const events = EventsMockData.getEvents();
            const event = events.find(e => e.id === eventId);
            
            if (event) {
                selectedEventId = eventId;
                document.getElementById('selectedEventTitle').textContent = event.title;
                document.getElementById('selectedEventDetails').textContent = 
                    `${new Date(event.start_date).toLocaleDateString()} at ${event.location}`;
                document.getElementById('eventInfo').style.display = 'block';
                
                updateStatistics(event);
            }
        }

        // Start QR scanning
        function startScanning() {
            if (!selectedEventId) {
                alert('Please select an event first');
                return;
            }

            const qrReaderElement = document.getElementById('qr-reader');
            qrReaderElement.style.display = 'block';

            html5QrCode = new Html5Qrcode("qr-reader");
            
            const config = {
                fps: 10,
                qrbox: { width: 250, height: 250 }
            };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                onScanSuccess,
                onScanFailure
            ).then(() => {
                document.getElementById('startScanBtn').style.display = 'none';
                document.getElementById('stopScanBtn').style.display = 'inline-flex';
            }).catch(err => {
                console.error('Error starting scanner:', err);
                alert('Error starting camera. Please ensure camera permissions are granted.');
            });
        }

        // Stop QR scanning
        function stopScanning() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById('qr-reader').style.display = 'none';
                    document.getElementById('startScanBtn').style.display = 'inline-flex';
                    document.getElementById('stopScanBtn').style.display = 'none';
                }).catch(err => {
                    console.error('Error stopping scanner:', err);
                });
            }
        }

        // Handle successful QR scan
        function onScanSuccess(decodedText, decodedResult) {
            try {
                const qrData = JSON.parse(decodedText);
                
                // Validate QR data
                if (qrData.eventId !== selectedEventId) {
                    showScanResult('Invalid QR code - wrong event', 'error');
                    return;
                }

                // Check if already scanned
                if (checkedInUsers.has(qrData.attendeeId)) {
                    showScanResult('User already checked in', 'warning');
                    return;
                }

                // Process check-in
                processCheckIn(qrData);
                
            } catch (error) {
                showScanResult('Invalid QR code format', 'error');
            }
        }

        // Handle scan failure
        function onScanFailure(error) {
            // Ignore scan failures (they happen frequently)
        }

        // Process check-in
        function processCheckIn(qrData) {
            // Simulate API call
            setTimeout(() => {
                checkedInUsers.add(qrData.attendeeId);
                scanCount++;
                
                showScanResult(`✅ Check-in successful for attendee ${qrData.attendeeId}`, 'success');
                addRecentScan(qrData);
                updateStatistics();
                
                // Auto-hide result after 3 seconds
                setTimeout(() => {
                    document.getElementById('scanResults').innerHTML = '';
                }, 3000);
                
            }, 500);
        }

        // Show scan result
        function showScanResult(message, type) {
            const resultsDiv = document.getElementById('scanResults');
            const className = type === 'error' ? 'scan-error' : 'scan-result';
            
            resultsDiv.innerHTML = `
                <div class="${className}">
                    <strong>${message}</strong>
                </div>
            `;
        }

        // Add recent scan
        function addRecentScan(qrData) {
            const recentScansDiv = document.getElementById('recentScans');
            
            if (scanCount === 1) {
                recentScansDiv.innerHTML = '';
            }
            
            const scanItem = document.createElement('div');
            scanItem.className = 'scan-item';
            scanItem.innerHTML = `
                <div>
                    <strong>Attendee ${qrData.attendeeId}</strong>
                    <div style="font-size: 0.875rem; color: rgba(255, 255, 255, 0.6);">
                        ${new Date().toLocaleTimeString()}
                    </div>
                </div>
                <div style="color: #10b981;">
                    <i class="fas fa-check-circle"></i>
                </div>
            `;
            
            recentScansDiv.insertBefore(scanItem, recentScansDiv.firstChild);
            
            // Keep only last 10 scans
            while (recentScansDiv.children.length > 10) {
                recentScansDiv.removeChild(recentScansDiv.lastChild);
            }
        }

        // Update statistics
        function updateStatistics(event) {
            const totalRegistered = event ? event.stats?.totalAttendees || 0 : 50; // Mock data
            const totalCheckedIn = checkedInUsers.size;
            const attendanceRate = totalRegistered > 0 ? Math.round((totalCheckedIn / totalRegistered) * 100) : 0;
            const noShows = Math.max(0, totalRegistered - totalCheckedIn);
            
            document.getElementById('totalRegistered').textContent = totalRegistered;
            document.getElementById('totalCheckedIn').textContent = totalCheckedIn;
            document.getElementById('attendanceRate').textContent = attendanceRate + '%';
            document.getElementById('noShows').textContent = noShows;
        }
    </script>
</body>
</html>
