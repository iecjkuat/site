<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} - JKUAT Innovation and Entrepreneurship Club</title>
    
    <!-- Stylesheets -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.0/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/css/main.css" rel="stylesheet">
    {{additional_css}}
    
    <!-- Meta Tags -->
    <meta name="description" content="{{description}}">
    <meta name="keywords" content="JKUAT, innovation, entrepreneurship, technology, students, club">
    <meta name="author" content="JKUAT Innovation and Entrepreneurship Club">
    
    <!-- Open Graph -->
    <meta property="og:title" content="{{title}} - JKUAT Innovation Club">
    <meta property="og:description" content="{{description}}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{url}}">
    <meta property="og:image" content="/assets/images/og-image.jpg">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/assets/icons/favicon.ico">
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
</head>
<body class="bg-pattern">
    <!-- Navigation -->
    {{navigation}}
    
    <!-- Main Content -->
    <main>
        {{content}}
    </main>
    
    <!-- Footer -->
    {{footer}}
    
    <!-- Core JavaScript -->
    <script src="/js/core/app.js"></script>
    <script src="/js/components/auth.js"></script>
    <script src="/js/components/message-notifications.js"></script>
    <script src="/js/services/events-service.js"></script>
    {{additional_js}}
</body>
</html>
