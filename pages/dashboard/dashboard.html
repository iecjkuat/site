<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - JKUAT Innovation Club</title>

  <!-- Security Meta Tags -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="X-XSS-Protection" content="1; mode=block">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net;">

  <!-- Global Systems -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.91.0/dist/umd/supabase.js"
    crossorigin="anonymous"></script>
  <script src="/shared/auth.js"></script>
  <script src="/shared/global-navbar.js"></script>

  <!-- Stylesheets -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="
    crossorigin="anonymous" rel="stylesheet">
  <link href="/shared/global-navbar.css" rel="stylesheet">
  <link href="/dashboard/dashboard.css?v=2026030304" rel="stylesheet">
  
  <style>
    /* Background */
    body {
      background: #0f172a url('/pages/shared/assets/images/backgrounds/tech-meeting-flatlay.jpg') center/cover fixed !important;
      background-attachment: fixed !important;
      background-size: cover !important;
      background-position: center !important;
      position: relative !important;
      padding-top: 110px !important;
    }

    /* Mobile padding */
    @media (max-width: 768px) {
      body { padding-top: 65px !important; }
    }
    
    body::before {
      content: '' !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: rgba(15, 23, 42, 0.5) !important;
      z-index: -1 !important;
      pointer-events: none !important;
    }

    /* Neutralise any old navbar classes that may come from other CSS files */
    .glass-nav,
    .nav-club-header,
    .nav-club-title,
    .nav-links-container,
    .nav-center,
    .nav-auth,
    .nav-dropdown,
    .dropdown-toggle,
    .dropdown-menu,
    .dropdown-item,
    .glass-button,
    .notification-bell {
      /* reset handled by global-navbar.css — no override needed here */
    }
  </style>



  <!-- SEO Meta Tags -->
  <meta name="description"
    content="Your personal dashboard for JKUAT Innovation Club activities, events, and progress tracking.">
  <meta name="keywords" content="JKUAT, dashboard, innovation, club, projects, events, membership, student">
</head>

<body class="dashboard-page bg-gradient-to-br from-indigo-700 via-purple-700 to-purple-900 min-h-screen">

  <!-- Navigation -->
  <div id="navigation-placeholder"></div>

  <!-- Dashboard Content -->
  <section class="dashboard-section container mx-auto px-4">

    <!-- Welcome Header -->
    <div class="dashboard-welcome">
      <div>
        <h1 class="text-white text-4xl font-bold mb-2">
          Hi, <span id="userName">Member</span>!
        </h1>
        <p class="text-gray-300 text-lg">Let's take a look at your activity today</p>
      </div>
      <div class="dashboard-welcome-actions">
        <div class="relative search-wrapper">
          <input type="text" placeholder="Search for activities..." 
                 class="bg-white/10 border border-white/20 rounded-full px-6 py-3 text-white placeholder-gray-400 focus:outline-none focus:border-white/40 search-input">
          <i class="fas fa-search absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
        </div>
        <a href="/settings" class="bg-gray-900 hover:bg-gray-800 text-white px-6 py-3 rounded-full font-semibold transition-all settings-btn">
          Settings
        </a>
      </div>
    </div>

    <!-- Main Dashboard - Horizontal Cards Row -->
    <div class="horizontal-cards-grid">

      <!-- My Projects -->
      <div class="glass-card compact-card">
        <div class="text-center">
          <div class="w-16 h-16 rounded-full bg-purple-500/20 flex items-center justify-center mx-auto mb-3">
            <i class="fas fa-folder-open text-3xl text-purple-400"></i>
          </div>
          <p class="text-white text-2xl font-bold mb-1" id="projectsCountDisplay">0</p>
          <p class="text-gray-400 text-sm mb-3">Projects</p>
          <button id="viewAllProjectsBtn" class="btn btn-primary btn-sm w-full">
            <i class="fas fa-eye"></i> View
          </button>
        </div>
      </div>

      <!-- My Ideas -->
      <div class="glass-card compact-card">
        <div class="text-center">
          <div class="w-16 h-16 rounded-full bg-yellow-500/20 flex items-center justify-center mx-auto mb-3">
            <i class="fas fa-lightbulb text-3xl text-yellow-400"></i>
          </div>
          <p class="text-white text-2xl font-bold mb-1" id="ideasCountDisplay">0</p>
          <p class="text-gray-400 text-sm mb-3">Ideas</p>
          <button id="viewAllIdeasBtn" class="btn btn-primary btn-sm w-full">
            <i class="fas fa-eye"></i> View
          </button>
        </div>
      </div>

      <!-- Payment History -->
      <div class="glass-card compact-card">
        <div class="text-center">
          <div class="w-16 h-16 rounded-full bg-green-500/20 flex items-center justify-center mx-auto mb-3">
            <i class="fas fa-receipt text-3xl text-green-400"></i>
          </div>
          <p class="text-white text-2xl font-bold mb-1" id="paymentsCountDisplay">0</p>
          <p class="text-gray-400 text-sm mb-3">Payments</p>
          <button id="viewAllPaymentsBtn" class="btn btn-primary btn-sm w-full">
            <i class="fas fa-eye"></i> View
          </button>
        </div>
      </div>

      <!-- Notifications -->
      <div class="glass-card compact-card">
        <div class="text-center">
          <div class="w-16 h-16 rounded-full bg-blue-500/20 flex items-center justify-center mx-auto mb-3">
            <i class="fas fa-bell text-3xl text-blue-400"></i>
          </div>
          <p class="text-white text-2xl font-bold mb-1" id="notificationsCountDisplay">0</p>
          <p class="text-gray-400 text-sm mb-3">Notifications</p>
          <button id="viewAllNotificationsBtn" class="btn btn-primary btn-sm w-full">
            <i class="fas fa-eye"></i> View
          </button>
        </div>
      </div>

    </div>

  </section>

  <!-- JS -->
  <script src="/dashboard/modules/notifications.js"></script>
  <script src="/dashboard/modules/projects.js"></script>
  <script src="/dashboard/dashboard.js?v=2026030310"></script>

  <!-- Minimal Footer -->
  <div id="footer-placeholder"></div>
  <script src="/shared/minimal-footer.js"></script>

</body>

</html>
