<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Profile - JKUAT Innovation Club</title>
    
    <!-- Stylesheets -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.0/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="../shared/assets/css/main.css" rel="stylesheet">
</head>
<body class="bg-pattern">
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
        <div class="glass-card" style="max-width: 600px; width: 100%; padding: 3rem;">
            
            <!-- Header -->
            <div style="text-align: center; margin-bottom: 3rem;">
                <div style="width: 80px; height: 80px; background: rgba(16, 185, 129, 0.2); backdrop-filter: blur(10px); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);">
                    <i class="fas fa-user-edit" style="font-size: 2rem; color: #10b981;"></i>
                </div>
                <h1 style="font-size: 2.5rem; font-weight: 700; color: white; margin-bottom: 1rem;">Complete Your Profile</h1>
                <p style="color: rgba(255, 255, 255, 0.8); font-size: 1rem; line-height: 1.6;">
                    Welcome to JKUAT Innovation Club! Let's complete your profile to get you started.
                </p>
            </div>

            <!-- Progress Bar -->
            <div style="margin-bottom: 2rem;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                    <span style="color: rgba(255, 255, 255, 0.8); font-size: 0.875rem;">Step <span id="currentStep">1</span> of 3</span>
                    <span style="color: rgba(255, 255, 255, 0.8); font-size: 0.875rem;"><span id="progressPercent">33</span>%</span>
                </div>
                <div style="width: 100%; height: 8px; background: rgba(255, 255, 255, 0.1); border-radius: 4px; overflow: hidden;">
                    <div id="progressBar" style="width: 33%; height: 100%; background: linear-gradient(135deg, #10b981, #059669); transition: width 0.3s ease;"></div>
                </div>
            </div>

            <!-- Step 1: Personal Information -->
            <div id="step1" class="wizard-step">
                <h2 style="font-size: 1.5rem; font-weight: 600; color: white; margin-bottom: 1.5rem; text-align: center;">
                    <i class="fas fa-user" style="margin-right: 0.5rem; color: #10b981;"></i>
                    Personal Information
                </h2>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
                    <div>
                        <label style="display: block; color: rgba(255, 255, 255, 0.9); font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem;">Bio</label>
                        <textarea name="bio" placeholder="Tell us about yourself..." rows="3" class="glass-input" style="resize: vertical;"></textarea>
                    </div>
                    <div>
                        <label style="display: block; color: rgba(255, 255, 255, 0.9); font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem;">Date of Birth</label>
                        <input type="date" name="dateOfBirth" class="glass-input">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
                    <div>
                        <label style="display: block; color: rgba(255, 255, 255, 0.9); font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem;">Gender</label>
                        <select name="gender" class="glass-input">
                            <option value="">Select Gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                            <option value="prefer_not_to_say">Prefer not to say</option>
                        </select>
                    </div>
                    <div>
                        <label style="display: block; color: rgba(255, 255, 255, 0.9); font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem;">LinkedIn Profile (Optional)</label>
                        <input type="url" name="linkedinUrl" placeholder="https://linkedin.com/in/yourprofile" class="glass-input">
                    </div>
                </div>
            </div>

            <!-- Step 2: Interests & Skills -->
            <div id="step2" class="wizard-step hidden">
                <h2 style="font-size: 1.5rem; font-weight: 600; color: white; margin-bottom: 1.5rem; text-align: center;">
                    <i class="fas fa-lightbulb" style="margin-right: 0.5rem; color: #10b981;"></i>
                    Interests & Skills
                </h2>
                
                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; color: rgba(255, 255, 255, 0.9); font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem;">Areas of Interest</label>
                    <div id="interestsGrid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.75rem;">
                        <!-- Interest checkboxes will be populated by JavaScript -->
                    </div>
                </div>

                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; color: rgba(255, 255, 255, 0.9); font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem;">Technical Skills</label>
                    <div id="skillsGrid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.75rem;">
                        <!-- Skill checkboxes will be populated by JavaScript -->
                    </div>
                </div>

                <div>
                    <label style="display: block; color: rgba(255, 255, 255, 0.9); font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem;">Experience Level</label>
                    <select name="experienceLevel" class="glass-input">
                        <option value="">Select Experience Level</option>
                        <option value="beginner">Beginner - Just getting started</option>
                        <option value="intermediate">Intermediate - Some experience</option>
                        <option value="advanced">Advanced - Experienced</option>
                        <option value="expert">Expert - Highly experienced</option>
                    </select>
                </div>
            </div>

            <!-- Step 3: Goals & Preferences -->
            <div id="step3" class="wizard-step hidden">
                <h2 style="font-size: 1.5rem; font-weight: 600; color: white; margin-bottom: 1.5rem; text-align: center;">
                    <i class="fas fa-target" style="margin-right: 0.5rem; color: #10b981;"></i>
                    Goals & Preferences
                </h2>
                
                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; color: rgba(255, 255, 255, 0.9); font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem;">What do you hope to achieve in the club?</label>
                    <div id="goalsGrid" style="display: grid; grid-template-columns: 1fr; gap: 0.75rem;">
                        <!-- Goal checkboxes will be populated by JavaScript -->
                    </div>
                </div>

                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; color: rgba(255, 255, 255, 0.9); font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem;">Preferred Communication</label>
                    <select name="preferredCommunication" class="glass-input">
                        <option value="">Select Preference</option>
                        <option value="email">Email</option>
                        <option value="sms">SMS</option>
                        <option value="whatsapp">WhatsApp</option>
                        <option value="telegram">Telegram</option>
                    </select>
                </div>

                <div>
                    <label style="display: block; color: rgba(255, 255, 255, 0.9); font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem;">Additional Comments (Optional)</label>
                    <textarea name="additionalComments" placeholder="Anything else you'd like us to know..." rows="3" class="glass-input" style="resize: vertical;"></textarea>
                </div>
            </div>

            <!-- Navigation Buttons -->
            <div style="display: flex; justify-content: space-between; margin-top: 2rem;">
                <button id="prevBtn" class="glass-button" style="visibility: hidden;">
                    <i class="fas fa-arrow-left"></i>Previous
                </button>
                
                <button id="nextBtn" class="glass-button primary">
                    Next<i class="fas fa-arrow-right" style="margin-left: 0.5rem;"></i>
                </button>
                
                <button id="completeBtn" class="glass-button primary hidden">
                    <i class="fas fa-check"></i>Complete Profile
                </button>
            </div>

            <!-- Skip Option -->
            <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid rgba(255, 255, 255, 0.1);">
                <p style="color: rgba(255, 255, 255, 0.8); font-size: 0.875rem;">
                    <a href="/dashboard" id="skipBtn" style="color: #64748b; text-decoration: none; font-weight: 600;">Skip for now - Go to Dashboard</a>
                </p>
            </div>
            
        </div>
    </div>

    <script src="complete-profile.js"></script>
</body>
</html>
