<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - JKUAT Innovation Club</title>
    
    <!-- Global Systems - Load in head with defer -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.91.0/dist/umd/supabase.js" crossorigin="anonymous"></script>
    <script src="/shared/auth.js"></script>
    <script src="/shared/global-navbar.js"></script>
    <script src="/feedback/feedback.js" defer></script>
    
    <!-- Styles -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/shared/global-navbar.css" rel="stylesheet">
    <link href="/feedback/feedback.css" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            padding-top: 110px !important;
            background: #0f172a url('/pages/shared/assets/images/backgrounds/tech-meeting-flatlay.jpg') center/cover fixed !important;
            background-attachment: fixed !important;
            background-size: cover !important;
            background-position: center !important;
            min-height: 100vh;
            position: relative !important;
        }
        @media (max-width: 768px) { body { padding-top: 65px !important; } }
        body::before {
            content: '' !important;
            position: fixed !important;
            top: 0 !important; left: 0 !important;
            width: 100% !important; height: 100% !important;
            background: rgba(15, 23, 42, 0.5) !important;
            z-index: -1 !important; pointer-events: none !important;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .mode-toggle {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.5rem;
            border-radius: 1rem;
        }
        
        .mode-btn {
            flex: 1;
            padding: 1rem;
            background: transparent;
            border: none;
            border-radius: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .mode-btn.active {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }
        
        .form-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            color: white;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        
        input, textarea {
            width: 100%;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0.5rem;
            color: white;
            font-family: inherit;
        }
        
        textarea {
            resize: vertical;
            min-height: 150px;
        }
        
        .rating-stars {
            display: flex;
            gap: 0.5rem;
            font-size: 2rem;
        }
        
        .star {
            cursor: pointer;
            opacity: 0.3;
            transition: all 0.2s;
        }
        
        .star.active {
            opacity: 1;
        }
        
        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            border-radius: 0.5rem;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }
        
        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .toast {
            position: fixed;
            top: 2rem;
            right: 2rem;
            background: #10b981;
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 0.5rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            z-index: 9999;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .error {
            background: #ef4444;
        }
        
        body {
            background: #0f172a url('/pages/shared/assets/images/backgrounds/tech-meeting-flatlay.jpg') center/cover fixed !important;
            background-attachment: fixed !important;
            background-size: cover !important;
            background-position: center !important;
            position: relative !important;
        }
        
        body::before {
            content: '' !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            background: rgba(15, 23, 42, 0.5) !important;
            z-index: -1 !important;
            opacity: 1 !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>
    
    <div class="container">
        <h1 style="color: white; text-align: center; margin-bottom: 1rem; font-size: 2.5rem;">
            Share Your Voice
        </h1>
        <p style="color: rgba(255, 255, 255, 0.7); text-align: center; margin-bottom: 2rem;">
            Choose how you want to share: anonymously or publicly
        </p>
        
        <!-- Mode Toggle -->
        <div class="mode-toggle">
            <button class="mode-btn active" data-mode="whisper">
                <i class="fas fa-user-secret"></i> Anonymous Whisper
            </button>
            <button class="mode-btn" data-mode="review">
                <i class="fas fa-star"></i> Public Review
            </button>
        </div>
        
        <!-- Form -->
        <div class="form-card">
            <form id="feedbackForm">
                <!-- Rating (hidden for whispers) -->
                <div class="form-group" id="ratingGroup" style="display: none;">
                    <label>Your Rating</label>
                    <div class="rating-stars" id="ratingStars">
                        <span class="star active" data-rating="1">⭐</span>
                        <span class="star active" data-rating="2">⭐</span>
                        <span class="star active" data-rating="3">⭐</span>
                        <span class="star active" data-rating="4">⭐</span>
                        <span class="star active" data-rating="5">⭐</span>
                    </div>
                </div>
                
                <!-- Message -->
                <div class="form-group">
                    <label>Your Message</label>
                    <textarea id="comment" required placeholder="Share your thoughts..."></textarea>
                </div>
                
                <!-- Submit -->
                <button type="submit" class="submit-btn" id="submitBtn">
                    <i class="fas fa-paper-plane"></i> Send Whisper
                </button>
            </form>
        </div>
    </div>

    <!-- Minimal Footer -->
    <div id="footer-placeholder"></div>
    <script src="/shared/minimal-footer.js"></script>
</body>
</html>
