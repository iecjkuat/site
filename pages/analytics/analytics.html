<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics & Reports - JKUAT Innovation Club Admin</title>
    
    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net;">
    
    <!-- Global Systems -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.91.0/dist/umd/supabase.js" 
            crossorigin="anonymous"></script>
    <script src="/shared/auth.js"></script>
    <script src="/shared/global-navbar.js"></script>
    <script src="/home/supabase-client.js"></script>
    <script src="/shared/global-navbar.js"></script>
    
    <!-- Stylesheets -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" 
          integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" 
          crossorigin="anonymous" rel="stylesheet">
    <link href="/home/home.css" rel="stylesheet">
    <link href="../shared/assets/css/main.css" rel="stylesheet">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/date-fns@2.29.3/index.min.js"></script>
    
    <!-- Override conflicting navbar styles -->
    <style>
        body { padding-top: 140px !important; }
    </style>
    
    <!-- Meta Tags -->
    <meta name="description" content="Analytics and reports dashboard for JKUAT Innovation Club administrators">
    <meta name="keywords" content="JKUAT, analytics, reports, admin, dashboard, statistics">
</head>
<body class="bg-pattern">
    <!-- Navigation -->
    <div id="navigation-placeholder"></div>

    <!-- Hero Section -->
    <section style="padding: 6rem 0 4rem 0; position: relative; z-index: 10;">
        <div class="container" style="text-align: center;">
            
            <!-- Badge -->
            <div style="display: inline-flex; align-items: center; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 50px; padding: 0.5rem 1.5rem; margin-bottom: 2rem; font-size: 0.875rem; font-weight: 600; letter-spacing: 0.05em;">
                <span style="width: 8px; height: 8px; background: #3b82f6; border-radius: 50%; margin-right: 0.75rem; animation: pulse 2s infinite;"></span>
                ANALYTICS & REPORTS
            </div>
            
            <!-- Main Heading -->
            <h1 style="font-size: clamp(2.5rem, 8vw, 4rem); font-weight: 800; line-height: 1.1; margin-bottom: 1.5rem;" class="gradient-text">
                Admin <span class="gradient-text accent">Dashboard</span>
            </h1>
            
            <!-- Subtitle -->
            <p style="font-size: clamp(1.125rem, 3vw, 1.5rem); line-height: 1.6; color: rgba(255, 255, 255, 0.9); max-width: 50rem; margin: 0 auto 3rem auto; font-weight: 400;">
                Comprehensive analytics and insights for <strong>membership, events, payments, engagement</strong>, and innovation metrics.
            </p>
            
            <!-- Date Range Selector -->
            <div style="max-width: 600px; margin: 0 auto; display: flex; gap: 1rem; align-items: center; justify-content: center; flex-wrap: wrap;">
                <div class="glass-card" style="padding: 1rem; border-radius: 15px; display: flex; gap: 1rem; align-items: center;">
                    <label style="color: rgba(255, 255, 255, 0.8); font-weight: 600;">Date Range:</label>
                    <input type="date" id="startDate" class="glass-input" style="padding: 0.5rem; border-radius: 8px; width: 150px;">
                    <span style="color: rgba(255, 255, 255, 0.6);">to</span>
                    <input type="date" id="endDate" class="glass-input" style="padding: 0.5rem; border-radius: 8px; width: 150px;">
                    <button id="updateRange" class="btn-primary" style="padding: 0.5rem 1rem; border-radius: 8px;">
                        <i class="fas fa-sync"></i> Update
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- Dashboard Content -->
    <section style="padding: 2rem 0 4rem 0; position: relative; z-index: 10;">
        <div class="container">
            
            <!-- Loading State -->
            <div id="loadingState" class="glass-card" style="padding: 4rem 2rem; text-align: center; border-radius: 20px; margin-bottom: 2rem;">
                <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: #3b82f6; margin-bottom: 1rem;"></i>
                <div style="color: rgba(255, 255, 255, 0.8); font-size: 1.125rem;">Loading analytics data...</div>
            </div>

            <!-- Error State -->
            <div id="errorState" class="glass-card hidden" style="padding: 4rem 2rem; text-align: center; border-radius: 20px; margin-bottom: 2rem; border: 1px solid rgba(239, 68, 68, 0.3);">
                <i class="fas fa-exclamation-triangle" style="font-size: 2rem; color: #ef4444; margin-bottom: 1rem;"></i>
                <div style="color: rgba(255, 255, 255, 0.8); font-size: 1.125rem; margin-bottom: 1rem;">Failed to load analytics data</div>
                <button id="retryLoad" class="btn-primary" style="padding: 0.75rem 1.5rem;">
                    <i class="fas fa-redo"></i> Retry
                </button>
            </div>

            <!-- Quick Stats Cards -->
            <div id="quickStats" class="hidden" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem; margin-bottom: 3rem;">
                <!-- Stats cards will be inserted here -->
            </div>

            <!-- Analytics Tabs -->
            <div id="analyticsContent" class="hidden">
                <!-- Tab Navigation -->
                <div class="glass-card" style="padding: 1.5rem; border-radius: 20px; margin-bottom: 2rem;">
                    <div style="display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center;">
                        <button class="analytics-tab active" data-tab="overview" style="padding: 0.75rem 1.5rem; background: rgba(59, 130, 246, 0.2); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 25px; color: white; font-weight: 600; cursor: pointer; transition: all 0.3s;">
                            <i class="fas fa-chart-line"></i> Overview
                        </button>
                        <button class="analytics-tab" data-tab="membership" style="padding: 0.75rem 1.5rem; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 25px; color: rgba(255, 255, 255, 0.8); font-weight: 600; cursor: pointer; transition: all 0.3s;">
                            <i class="fas fa-users"></i> Membership
                        </button>
                        <button class="analytics-tab" data-tab="events" style="padding: 0.75rem 1.5rem; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 25px; color: rgba(255, 255, 255, 0.8); font-weight: 600; cursor: pointer; transition: all 0.3s;">
                            <i class="fas fa-calendar"></i> Events
                        </button>
                        <button class="analytics-tab" data-tab="payments" style="padding: 0.75rem 1.5rem; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 25px; color: rgba(255, 255, 255, 0.8); font-weight: 600; cursor: pointer; transition: all 0.3s;">
                            <i class="fas fa-money-bill-wave"></i> Payments
                        </button>
                        <button class="analytics-tab" data-tab="engagement" style="padding: 0.75rem 1.5rem; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 25px; color: rgba(255, 255, 255, 0.8); font-weight: 600; cursor: pointer; transition: all 0.3s;">
                            <i class="fas fa-mouse-pointer"></i> Engagement
                        </button>
                        <button class="analytics-tab" data-tab="feedback" style="padding: 0.75rem 1.5rem; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 25px; color: rgba(255, 255, 255, 0.8); font-weight: 600; cursor: pointer; transition: all 0.3s;">
                            <i class="fas fa-comments"></i> Feedback
                        </button>
                        <button class="analytics-tab" data-tab="ideas" style="padding: 0.75rem 1.5rem; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 25px; color: rgba(255, 255, 255, 0.8); font-weight: 600; cursor: pointer; transition: all 0.3s;">
                            <i class="fas fa-lightbulb"></i> Ideas
                        </button>
                    </div>
                </div>

                <!-- Tab Content -->
                <div id="tabContent">
                    <!-- Content will be dynamically loaded here -->
                </div>
            </div>

            <!-- Export Options -->
            <div id="exportOptions" class="hidden glass-card" style="padding: 2rem; border-radius: 20px; margin-top: 3rem;">
                <h3 style="color: white; font-weight: 700; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
                    <i class="fas fa-download"></i> Export Reports
                </h3>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
                    <button class="export-btn" data-type="dashboard" data-format="json" style="padding: 1rem; background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 15px; color: white; cursor: pointer; transition: all 0.3s;">
                        <i class="fas fa-file-code"></i> Dashboard (JSON)
                    </button>
                    <button class="export-btn" data-type="membership" data-format="csv" style="padding: 1rem; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 15px; color: white; cursor: pointer; transition: all 0.3s;">
                        <i class="fas fa-file-csv"></i> Membership (CSV)
                    </button>
                    <button class="export-btn" data-type="events" data-format="json" style="padding: 1rem; background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 15px; color: white; cursor: pointer; transition: all 0.3s;">
                        <i class="fas fa-file-alt"></i> Events (JSON)
                    </button>
                    <button class="export-btn" data-type="payments" data-format="csv" style="padding: 1rem; background: rgba(139, 92, 246, 0.1); border: 1px solid rgba(139, 92, 246, 0.3); border-radius: 15px; color: white; cursor: pointer; transition: all 0.3s;">
                        <i class="fas fa-file-invoice-dollar"></i> Payments (CSV)
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <!-- JavaScript -->
    <script src="../shared/core/app.js"></script>
    <script src="analytics.js"></script>
</body>
</html>
