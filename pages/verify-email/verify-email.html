<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Verification - JKUAT Innovation Club</title>

  <!-- Tailwind -->
  <link
    href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.0/dist/tailwind.min.css"
    rel="stylesheet"
  />

  <!-- Icons -->
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    rel="stylesheet"
  />

  <!-- Shared styles -->
  <link href="../shared/assets/css/main.css" rel="stylesheet" />
  <link href="/verify-email/verify-email.css" rel="stylesheet" />
</head>

<body class="bg-pattern">
  <div class="min-h-screen flex items-center justify-center p-6">
    <div
      class="glass-card w-full max-w-md text-center p-12"
    >

      <!-- Status Icon -->
      <div
        id="statusIcon"
        class="w-20 h-20 mx-auto mb-8 flex items-center justify-center rounded-full border shadow-lg
               bg-amber-400/20 border-amber-400/30"
      >
        <div class="spinner w-8 h-8"></div>
      </div>

      <!-- Status Message -->
      <div id="statusMessage">
        <h1 class="text-2xl font-bold text-white mb-4">
          Verifying Email...
        </h1>
        <p class="text-white/80 leading-relaxed">
          Please wait while we confirm your email address.
        </p>
      </div>

      <!-- Action Buttons -->
      <div
        id="actionButtons"
        class="hidden mt-8 space-y-4"
      >
        <button
          id="completeProfileBtn"
          class="glass-button primary w-full justify-center"
        >
          <i class="fas fa-user-edit mr-2"></i>
          Complete Your Profile
        </button>

        <button
          id="goToLoginBtn"
          class="glass-button w-full justify-center"
        >
          <i class="fas fa-sign-in-alt mr-2"></i>
          Go to Login
        </button>
      </div>

    </div>
  </div>

  <!-- Email verification logic -->
  <script>
    class VerifyEmailPage {
      async init() {
        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
          this.showError('Invalid verification link. No token provided.');
          return;
        }

        try {
          // Call backend API to verify email
          const response = await fetch(`/api/v1/auth/verify-email?token=${encodeURIComponent(token)}`);
          const data = await response.json();

          if (response.ok && data.verified) {
            this.showSuccess(data.message || 'Your email has been successfully verified!');
          } else if (data.alreadyVerified) {
            this.showSuccess('Your email is already verified. You can log in now.');
          } else if (data.expired) {
            this.showError('This verification link has expired. Please request a new one.');
          } else {
            this.showError(data.message || 'Verification failed. Please try again.');
          }
        } catch (err) {
          console.error('Verification error:', err);
          this.showError('Network error. Please check your connection and try again.');
        }

        this.bindEvents();
      }

      showSuccess(message) {
        const icon = document.getElementById("statusIcon");
        const messageBox = document.getElementById("statusMessage");
        const actions = document.getElementById("actionButtons");

        icon.className =
          "w-20 h-20 mx-auto mb-8 flex items-center justify-center rounded-full border shadow-lg " +
          "bg-emerald-400/20 border-emerald-400/30";
        icon.innerHTML =
          '<i class="fas fa-check text-2xl text-emerald-400"></i>';

        messageBox.innerHTML = `
          <h1 class="text-2xl font-bold text-white mb-4">
            Email Verified!
          </h1>
          <p class="text-white/80 leading-relaxed">
            ${this.escapeHtml(message)} You can now access all club features.
          </p>
        `;

        actions.classList.remove("hidden");
      }

      showError(message) {
        const icon = document.getElementById("statusIcon");
        const messageBox = document.getElementById("statusMessage");
        const actions = document.getElementById("actionButtons");

        icon.className =
          "w-20 h-20 mx-auto mb-8 flex items-center justify-center rounded-full border shadow-lg " +
          "bg-red-500/20 border-red-500/30";
        icon.innerHTML =
          '<i class="fas fa-times text-2xl text-red-400"></i>';

        messageBox.innerHTML = `
          <h1 class="text-2xl font-bold text-white mb-4">
            Verification Failed
          </h1>
          <p class="text-white/80 leading-relaxed">
            ${this.escapeHtml(message)}
          </p>
        `;

        actions.classList.remove("hidden");
      }

      escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      bindEvents() {
        document.addEventListener("click", (e) => {
          if (e.target.closest("#completeProfileBtn")) {
            window.location.href = "/complete-profile";
          }

          if (e.target.closest("#goToLoginBtn")) {
            window.location.href = "/signin";
          }
        });
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      new VerifyEmailPage().init();
    });
  </script>
</body>
</html>
