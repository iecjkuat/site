<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - JKUAT Innovation & Entrepreneurship Club</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="/shared/styles/main.css">
    <link rel="stylesheet" href="/shared/styles/navbar.css">
    <link rel="stylesheet" href="/blog/blog.css">
</head>

<body class="blog-page">

    <!-- NAVBAR -->
    <div id="navbar"></div>
    <script>
        fetch('/shared/navbar.html')
            .then(r => r.text())
            .then(html => {
                document.getElementById('navbar').innerHTML = html;
                const path = window.location.pathname;
                document.querySelectorAll('.nav-link').forEach(l => {
                    if (l.getAttribute('href') === path) l.style.color = '#10b981';
                });
                const t = document.getElementById('navToggle');
                const nl = document.getElementById('navLinks');
                if (t && nl) t.addEventListener('click', () => nl.classList.toggle('active'));
                const lb = document.getElementById('navLoginBtn');
                const jb = document.getElementById('navJoinBtn');
                if (lb) lb.addEventListener('click', () => window.location.href = '/signin');
                if (jb) jb.addEventListener('click', () => window.location.href = '/signup');
            });
    </script>

    <!-- HERO -->
    <section class="blog-hero">
        <div class="container text-center">
            <h1>Blog & <span class="text-green">Announcements</span></h1>
            <p>Stories, insights, and updates from the JKUAT Innovation Club community.</p>
        </div>
    </section>

    <!-- FILTERS -->
    <section class="blog-filters-section">
        <div class="container">
            <div class="filters-bar">
                <div class="filter-tabs">
                    <button class="filter-tab active" data-filter="all">All</button>
                    <button class="filter-tab" data-filter="article">Articles</button>
                    <button class="filter-tab" data-filter="news">News</button>
                    <button class="filter-tab" data-filter="announcement">Announcements</button>
                </div>
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" id="blogSearch" placeholder="Search posts...">
                    <select id="sortSelect">
                        <option value="date-desc">Newest</option>
                        <option value="date-asc">Oldest</option>
                        <option value="title-asc">A–Z</option>
                    </select>
                </div>
            </div>
        </div>
    </section>

    <!-- CONTENT -->
    <section class="blog-content">
        <div class="container">

            <div id="loadingState" class="state-box">
                <div class="spinner"></div>
                <p>Loading posts...</p>
            </div>

            <div id="emptyState" class="state-box" style="display:none;">
                <i class="fas fa-newspaper empty-icon"></i>
                <h3>No posts found</h3>
                <p>Try a different filter or check back soon.</p>
            </div>

            <div id="blogGrid" class="blog-grid" style="display:none;"></div>

            <div id="loadMoreContainer" style="text-align:center; margin-top:2rem; display:none;">
                <button id="loadMoreBtn" class="btn btn-secondary">Load More</button>
            </div>

        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <div class="container text-center">
            <p>JKUAT Innovation & Entrepreneurship Club</p>
            <p class="mt-1">
                <a href="/events">Events</a> |
                <a href="/projects">Projects</a> |
                <a href="/about">About</a>
            </p>
            <p class="mt-2">&copy; 2026 JKUAT Innovation Club</p>
        </div>
    </footer>

    <script src="/blog/blog.js"></script>
</body>
</html>
