<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - JKUAT Innovation Club</title>

    <!-- SEO -->
    <meta name="description" content="Sign in to your IEC JKUAT account.">
    <meta name="robots" content="noindex, nofollow">

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/auth/auth.css">

    <style>
        /* Password toggle button */
        .input-group .pw-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #95a5a6;
            cursor: pointer;
            padding: 0.25rem;
            font-size: 1rem;
            line-height: 1;
            transition: color 0.2s;
        }
        .input-group .pw-toggle:hover { color: #2563eb; }

        /* Remember me + forgot password row */
        .auth-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .auth-options .checkbox-group {
            margin-bottom: 0;
        }
        .forgot-link {
            font-size: 0.875rem;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }
        .forgot-link:hover { text-decoration: underline; }

        /* Screen-reader only labels */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0,0,0,0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <!-- Left Side — Form -->
        <div class="form-side">
            <div class="form-content">
                <div class="logo-section">
                    <i class="fas fa-rocket logo-icon" aria-hidden="true"></i>
                </div>

                <h1 class="page-title">SIGN IN</h1>

                <form id="signinForm" class="auth-form" novalidate>
                    <!-- Live region for screen readers -->
                    <div id="messageContainer" role="status" aria-live="polite"></div>

                    <!-- Email -->
                    <div class="input-group">
                        <label for="email" class="sr-only">Email address</label>
                        <i class="fas fa-envelope input-icon" aria-hidden="true"></i>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Email address"
                            required
                            autocomplete="email"
                            inputmode="email"
                            aria-required="true"
                            aria-describedby="messageContainer"
                        >
                    </div>

                    <!-- Password -->
                    <div class="input-group">
                        <label for="password" class="sr-only">Password</label>
                        <i class="fas fa-lock input-icon" aria-hidden="true"></i>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Password"
                            required
                            autocomplete="current-password"
                            aria-required="true"
                        >
                        <button
                            type="button"
                            class="pw-toggle"
                            id="pwToggle"
                            aria-label="Show password"
                            tabindex="0"
                        >
                            <i class="fas fa-eye" id="pwToggleIcon" aria-hidden="true"></i>
                        </button>
                    </div>

                    <!-- Remember me + Forgot password (same row — standard UX) -->
                    <div class="auth-options">
                        <div class="checkbox-group">
                            <input type="checkbox" id="rememberMe" name="rememberMe">
                            <label for="rememberMe">Remember me</label>
                        </div>
                        <a href="/reset-password" class="forgot-link">Forgot password?</a>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="submit-btn" id="submitBtn">
                        <span class="btn-text">SIGN IN</span>
                        <span class="btn-loader" aria-hidden="true"></span>
                    </button>
                </form>

                <!-- Sign Up Link -->
                <div class="switch-auth" style="margin-top:1.5rem;">
                    Don't have an account? <a href="/signup" class="link">Sign Up</a>
                </div>
            </div>
        </div>

        <!-- Right Side — Branding -->
        <div class="image-side" role="presentation">
            <div class="image-overlay">
                <h2 class="brand-title">JKUAT INNOVATION</h2>
                <p class="brand-subtitle">&amp; ENTREPRENEURSHIP CLUB</p>
                <p class="brand-tagline">Welcome back, innovator!</p>
            </div>
        </div>
    </div>

    <!-- Scripts — load order matters: supabase → auth → api → auth-state → page -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.91.0/dist/umd/supabase.js"></script>
    <script src="/shared/auth.js"></script>
    <script src="/shared/api.js"></script>
    <script src="/shared/auth-state.js"></script>
    <script src="/auth/signin.js"></script>

    <!-- Password show/hide toggle (inline — no extra file needed) -->
    <script>
        document.getElementById('pwToggle')?.addEventListener('click', function() {
            const input = document.getElementById('password');
            const icon  = document.getElementById('pwToggleIcon');
            const show  = input.type === 'password';
            input.type  = show ? 'text' : 'password';
            icon.className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
            this.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        });
    </script>

    <div id="footer-placeholder"></div>
    <script src="/shared/minimal-footer.js"></script>
</body>
</html>
