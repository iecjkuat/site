<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <title>Resources & Documentation - JKUAT Innovation and Entrepreneurship Club</title>

    <!-- Global Systems -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.91.0/dist/umd/supabase.js" 
            crossorigin="anonymous"></script>
    <script src="/shared/auth.js"></script>
    <script src="/shared/global-navbar.js"></script>
    <script src="/home/supabase-client.js"></script>
    <script src="/shared/global-navbar.js"></script>

    <!-- Stylesheets -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" 
          integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" 
          crossorigin="anonymous" rel="stylesheet">
    <link href="/home/home.css" rel="stylesheet">
    <link href="resources.css" rel="stylesheet">
    
    <!-- Override conflicting navbar styles -->
    <style>
        body { padding-top: 140px !important; }
    </style>

    <!-- SEO Meta Tags -->
    <meta name="description"
        content="Access learning resources, documentation, and tools for JKUAT Innovation Club members.">
    <meta name="keywords"
        content="JKUAT, resources, documentation, learning, tools, guides, innovation, entrepreneurship">
    <meta name="author" content="JKUAT Innovation Club">
</head>

<body class="bg-pattern">
    <!-- Shared navbar will be automatically inserted here -->

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="container">

            <!-- Badge -->
            <div class="hero-badge">
                <span class="badge-indicator"></span>
                LEARNING RESOURCES
            </div>

            <!-- Main Heading -->
            <h1 class="hero-title">
                Resources &<br>
                <span class="accent-text">Documentation</span>
            </h1>

            <!-- Subtitle -->
            <p class="hero-subtitle">
                Access essential <strong>documents, templates, guides</strong>, and resources to support your innovation
                journey at JKUAT.
            </p>
        </div>
    </section>

    <!-- Resource Categories -->
    <section style="padding: 2rem 0; position: relative; z-index: 10;">
        <div class="container">
            <div id="categoryFilters" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem;"
                role="tablist" aria-label="Resource categories">
                <button class="category-btn btn-glass active" data-category="all" role="tab" aria-selected="true"
                    aria-controls="resourcesGrid">
                    <i class="fas fa-th-large"></i>All Resources
                </button>
                <button class="category-btn btn-glass" data-category="Constitution" role="tab" aria-selected="false"
                    aria-controls="resourcesGrid">
                    <i class="fas fa-gavel"></i>Constitution
                </button>
                <button class="category-btn btn-glass" data-category="Handbook" role="tab" aria-selected="false"
                    aria-controls="resourcesGrid">
                    <i class="fas fa-book"></i>Handbook
                </button>
                <button class="category-btn btn-glass" data-category="Templates" role="tab" aria-selected="false"
                    aria-controls="resourcesGrid">
                    <i class="fas fa-file-alt"></i>Templates
                </button>
                <button class="category-btn btn-glass" data-category="Guidelines" role="tab" aria-selected="false"
                    aria-controls="resourcesGrid">
                    <i class="fas fa-list-ul"></i>Guidelines
                </button>
                <button class="category-btn btn-glass" data-category="Innovation" role="tab" aria-selected="false"
                    aria-controls="resourcesGrid">
                    <i class="fas fa-lightbulb"></i>Innovation
                </button>
                <button class="category-btn btn-glass" data-category="Technical" role="tab" aria-selected="false"
                    aria-controls="resourcesGrid">
                    <i class="fas fa-code"></i>Technical
                </button>
            </div>
        </div>
    </section>

    <!-- Resources Section -->
    <section style="padding: 2rem 0 4rem 0; position: relative; z-index: 10;">
        <div class="container">
            <div class="section-header" style="text-align: center; margin-bottom: 3rem;">
                <div
                    style="display: inline-block; background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: white; padding: 0.5rem 1.5rem; border-radius: 50px; font-size: 0.875rem; font-weight: 600; margin-bottom: 1rem; letter-spacing: 0.05em;">
                    AVAILABLE RESOURCES
                </div>
                <h2
                    style="font-size: clamp(2rem, 5vw, 3rem); font-weight: 800; color: white; margin-bottom: 1rem; line-height: 1.2;">
                    Access <span class="accent-text">Learning</span> Materials
                </h2>
                <p class="section-subtitle"
                    style="max-width: 50rem; margin: 0 auto; font-size: 1.125rem; color: white; line-height: 1.6; font-weight: 400; opacity: 0.9;">
                    Download essential documents, templates, and guides to support your innovation journey.
                </p>
            </div>

            <!-- Resources Grid -->
            <div id="resourcesGrid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem;">
                <!-- Dynamically populated by resources.js -->
            </div><!-- Load More Button -->
            <div style="text-align: center; margin-top: 3rem;">
                <button id="loadMoreResourcesBtn" class="btn btn-glass btn-lg">
                    <i class="fas fa-plus"></i>Load More Resources
                </button>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../home/supabase-client.js"></script>
    <script src="../shared/global-auth.js"></script>
    <script src="/shared/core/app.js"></script>
    <script src="/shared/components/navigation.js"></script>
    <script src="/shared/components/notifications.js"></script>
    <script src="resources.js"></script>

    <script>
        // Load navigation and initialize page
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('DOM loaded, initializing resources page...');

            // Initialize navigation
            if (window.Navigation) {
                window.navigation = new Navigation();
                console.log('Navigation initialized');
            }

            // Resources page will be initialized by resources.js
            console.log('Resources page will be initialized by resources.js');
        });
    </script>
</body>

</html>
