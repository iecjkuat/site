<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - JKUAT Innovation Club</title>

  <!-- Tailwind -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.0/dist/tailwind.min.css" rel="stylesheet" />

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

  <!-- Shared Styles -->
  <link href="../shared/assets/css/main.css" rel="stylesheet" />
  <link href="/reset-password/reset-password.css" rel="stylesheet" />
</head>
<body class="bg-pattern">
  <div class="min-h-screen flex items-center justify-center p-6">
    <div class="glass-card w-full max-w-md p-12">

      <!-- Header -->
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-blue-400/20 backdrop-blur-md border border-blue-400/30 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
          <i class="fas fa-key text-blue-500 text-xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-white mb-1">Reset Your Password</h1>
        <p class="text-white/80 text-sm">Enter your new password below</p>
      </div>

      <!-- Reset Form -->
      <form id="resetPasswordForm" class="flex flex-col gap-6">
        <div>
          <label class="block text-white/90 font-semibold text-sm mb-1">
            <i class="fas fa-lock text-blue-500 mr-1"></i>New Password
          </label>
          <input type="password" name="newPassword" placeholder="Enter your new password" required minlength="6" class="glass-input" />
          <p class="text-white/60 text-xs mt-1">Password must be at least 6 characters long</p>
        </div>

        <div>
          <label class="block text-white/90 font-semibold text-sm mb-1">
            <i class="fas fa-lock text-blue-500 mr-1"></i>Confirm Password
          </label>
          <input type="password" name="confirmPassword" placeholder="Confirm your new password" required minlength="6" class="glass-input" />
        </div>

        <button type="submit" id="resetSubmitBtn" class="glass-button primary w-full justify-center">
          <i class="fas fa-check mr-2"></i>Reset Password
        </button>
      </form>

      <!-- Status Message -->
      <div id="statusMessage" class="hidden mt-6 p-4 rounded text-center"></div>

      <!-- Back to Home -->
      <div class="text-center mt-6 pt-6 border-t border-white/10">
        <p class="text-white/80 text-sm">
          <a href="/" class="text-blue-500 font-semibold no-underline">Back to Home</a>
        </p>
      </div>
    </div>
  </div>

  <script type="module">
    import { getSupabase } from '/shared/js/supabase.js';

    class ResetPasswordPage {
      constructor() {
        this.token = null;
        this.init();
      }

      async init() {
        const urlParams = new URLSearchParams(window.location.search);
        this.token = urlParams.get('access_token') || urlParams.get('token'); // Support both Supabase and custom token formats

        // Also check URL hash for Supabase token (it's often in #access_token=...)
        if (!this.token && window.location.hash) {
          const hashParams = new URLSearchParams(window.location.hash.substring(1));
          this.token = hashParams.get('access_token');
        }

        if (!this.token) {
          this.showError('Invalid or expired reset link. Please request a new one.');
          return;
        }

        // Initialize Supabase client
        try {
          await getSupabase();
        } catch (err) {
          console.error('Failed to initialize:', err);
          this.showError('Failed to initialize. Please refresh the page.');
          return;
        }

        this.bindEvents();
      }

      bindEvents() {
        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          await this.handlePasswordReset(e);
        });
      }

      async handlePasswordReset(event) {
        const form = event.target;
        const formData = new FormData(form);
        const submitBtn = document.getElementById('resetSubmitBtn');

        const newPassword = formData.get('newPassword');
        const confirmPassword = formData.get('confirmPassword');

        // Password strength validation
        if (newPassword.length < 8) {
          this.showError('Password must be at least 8 characters long.');
          return;
        }

        if (newPassword !== confirmPassword) {
          this.showError('Passwords do not match. Please try again.');
          return;
        }

        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<div class="spinner"></div>Resetting...';
        submitBtn.disabled = true;

        try {
          // Get Supabase client
          const supabase = await getSupabase();

          // Supabase password reset - use the session from URL token
          const { data, error } = await supabase.auth.updateUser({
            password: newPassword
          });

          if (error) {
            this.showError(error.message || 'Password reset failed.');
          } else {
            this.showSuccess('Your password has been reset successfully!');
            setTimeout(() => window.location.href = '/signin', 3000);
          }
        } catch (err) {
          console.error('Reset error:', err);
          this.showError('Network error. Please try again.');
        } finally {
          submitBtn.innerHTML = originalText;
          submitBtn.disabled = false;
        }
      }

      showSuccess(message) {
        const status = document.getElementById('statusMessage');
        status.classList.remove('hidden');
        status.style.background = 'rgba(16, 185, 129, 0.1)';
        status.style.border = '1px solid rgba(16, 185, 129, 0.2)';
        status.style.color = '#10b981';
        status.innerHTML = `
          <i class="fas fa-check-circle mr-2"></i>${message}<br>
          <span style="font-size: 0.8rem; opacity: 0.8;">Redirecting to login…</span>
        `;
      }

      showError(message) {
        const status = document.getElementById('statusMessage');
        status.classList.remove('hidden');
        status.style.background = 'rgba(239, 68, 68, 0.1)';
        status.style.border = '1px solid rgba(239, 68, 68, 0.2)';
        status.style.color = '#ef4444';
        status.innerHTML = `<i class="fas fa-exclamation-circle mr-2"></i>${message}`;
      }
    }

    document.addEventListener('DOMContentLoaded', () => new ResetPasswordPage());
  </script>
</body>
</html>
